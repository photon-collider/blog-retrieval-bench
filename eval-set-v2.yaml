  - id: sf01
    type: single_fact
    topic: ai-llm
    question: "In one of Bryan's blog posts he timed how long it takes to process input tokens and output tokens. How much longer did it take for his laptop to generate output tokens than input tokens?"
    v1_question: In Bryan's experiment, how much more time did an output token take than an input token?
    v1_paraphrase: When he timed a tiny model on his laptop, how big was the gap between reading a prompt
      and writing a reply?
    source_posts:
    - one-reason-input-tokens-are-cheaper-than-output-tokens
    evidence:
      one-reason-input-tokens-are-cheaper-than-output-tokens: an output token uses 29× more time than an
        input token
    reference_answer: Up to about 29x longer per output token than per input token, measured with a 2,048-token
      prompt on Qwen2.5-0.5B-Instruct running on his M2 MacBook Pro.
    key_facts:
    - up to ~29x more time per output token
    - measured at a 2,048-token prompt
    - Qwen2.5-0.5B-Instruct on an M2 MacBook Pro

  - id: sf02
    type: single_fact
    topic: ai-llm
    question: 'What metrics did Bryan use to characterize how quickly an LLM starts replying and how long it take for a complete answer to be generated?'
    v1_question: What do TTFT and TPOT measure?
    v1_paraphrase: Which two latency numbers did he use to describe how quickly a reply starts and how quickly
      it streams?
    source_posts:
    - one-reason-input-tokens-are-cheaper-than-output-tokens
    evidence:
      one-reason-input-tokens-are-cheaper-than-output-tokens: the time to first token (TTFT) and the time
        per output token (TPOT)
    reference_answer: TTFT (time to first token) is how long before the response starts streaming, which
      is dominated by the prefill phase. TPOT (time per output token) is how fast each subsequent token
      is generated during the decode phase.
    key_facts:
    - TTFT = time to first token, tied to prefill
    - TPOT = time per output token, tied to decode
    notes: Acronym-heavy question; expect BM25 to do well on the original phrasing and worse on the paraphrase.

