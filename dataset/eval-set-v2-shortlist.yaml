# Blog Q&A eval set, v2 (working draft): shortlist
#
# Built from eval-set-v2.yaml: the answerable v1-subset questions plus cs21
# (minus mp06 and mp22, dropped as ambiguous), and every other question
# already written in eval-set-v2.yaml. Write new questions in this file.
#
# Seeded from eval-set.yaml (v1), which stays unchanged. v1's 20 unanswerable
# questions are left out because retrieval metrics can't score them.
#
# How to use this file
#   - Write your phrasing in `question`. A blank `question` means the item is
#     skipped. Aim for about 40 filled in.
#   - Phrase it the way a reader would ask. Don't copy the post's distinctive
#     wording, and don't avoid the natural terms either. Word overlap with the
#     post is measured afterwards instead of being controlled.
#   - `v1_question` and `v1_paraphrase` are for reference only. They're removed
#     when the set is finalized.
#   - `in_v1_subset: true` marks the 40 questions sampled for v1, if you want a
#     starting point.
#   - If your wording changes what's being asked, update the labels as well
#     (source_posts, evidence, reference_answer, key_facts).
#
# Composition (54): single_fact 35, current_state 8, multi_post 5, opinion 6.
#   Report results per type; single_fact would dominate a pooled score.
#   No post as a required source (source_posts) for more than 3 questions.
#   Cover as many of the 44 posts as you can. v1 has no question for
#   straight-line-predicts-how-fast-my-laptop-generates-llm-tokens.
#
# Fields
#   id               stable identifier, never reuse
#   type             single_fact | multi_post | current_state | opinion
#   topic            ai-llm | ml-nlp | backend | web-design | homelab | self-hosting |
#                    computing | personal | writing-productivity | cross-topic
#   probe            optional: where the answer sits or what makes it hard
#                    sibling_confusion | near_miss | caption_only | alt_text_only |
#                    table_only | code_only | callout_only | buried_detail | short_post |
#                    long_post | recency | aggregation | multi_hop
#                    (v1's wording probes vocab_mismatch and lexical_collision are dropped)
#   question         your phrasing; blank = skip
#   source_posts     posts REQUIRED for a full answer (the recall denominator)
#   acceptable_posts posts that also contain the answer, or part of it (count as hits)
#   superseded_posts older posts with outdated info (current_state only)
#   related_posts    near-miss posts likely to tempt a wrong answer; not relevant
#   evidence         slug -> verbatim quote; check_eval_set.py confirms it's in the post
#   reference_answer short ideal answer
#   key_facts        atomic facts a correct answer must include
#   notes            caveats, things to verify
#
# as_of: answers reflect the blog as of 2026-11-05 (cs21 added 2026-11-14).

as_of: "2026-11-14"

