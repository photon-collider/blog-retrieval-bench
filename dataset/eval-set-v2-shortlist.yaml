  - id: sf06
    type: single_fact
    topic: backend
    question: 'What caused custom metadata to disappear from Celery and how did Bryan solve it?'
    v1_question: Why did custom metadata disappear from Celery task documents in MongoDB, and how did Bryan
      fix it?
    v1_paraphrase: Why was the extra information he attached to background jobs getting wiped from the database?
    source_posts:
    - custom-celery-mongodb-backend
    evidence:
      custom-celery-mongodb-backend: It now uses `update_one` instead of `replace_one`
    reference_answer: Celery's MongoDB backend overwrites the task document with replace_one when storing
      results. He subclassed MongoBackend and overrode _store_result to use update_one with $set, created
      the initial document in a before_task_publish signal handler, and enabled task_track_started.
    key_facts:
    - default backend replaces the document (replace_one)
    - custom MongoBackend subclass overriding _store_result with update_one/$set
    - before_task_publish signal creates the initial document
    - task_track_started enabled
    notes: The post's prose says task_tracking=True, but its code uses task_track_started=True. The code
      is correct.

