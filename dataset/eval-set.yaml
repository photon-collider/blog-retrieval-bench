# Blog Q&A eval set: 49 questions about the 44 posts on bryananthonio.com
#
# Each question can be answered from a single post. Questions were first
# generated with Claude and then revised by hand to sound like a reader asking.
# Every question also has a `paraphrase`: the same question reworded (see below).
# The eval runs every retriever on both wordings.
#
# Composition (49): single_fact 35, current_state 8, opinion 6.
#   current_state questions have an answer that changed over time: an older post
#   (superseded_posts) gives the outdated answer, and only a newer post has the
#   current one.
#   Five questions whose answers span several posts were written and then left
#   out: Hit@k is too easy a test for them, and five is too few to compare
#   retrievers on any other metric. They are in the git history.
#   Unanswerable questions are left out too: with no source post there is
#   nothing to retrieve.
#
# Fields
#   id               stable identifier, never reused
#   type             single_fact | current_state | opinion
#   topic            ai-llm | ml-nlp | backend | web-design | homelab | self-hosting |
#                    computing | personal | writing-productivity | cross-topic
#   probe            optional: where the answer sits or what makes it hard
#                    sibling_confusion | near_miss | caption_only | alt_text_only |
#                    table_only | code_only | callout_only | buried_detail | short_post |
#                    long_post | recency | aggregation | multi_hop
#   question         the direct wording, written with the post in mind
#   source_posts     every post that contains the answer. Retrieving any one of
#                    them counts as a hit.
#   superseded_posts older posts with an outdated answer (current_state only)
#   related_posts    near misses: posts on the topic that don't answer the question
#   evidence         slug -> verbatim quote; check_eval_set.py confirms it's in the post
#   reference_answer short ideal answer
#   key_facts        atomic facts a correct answer must include
#   notes            caveats and working notes from writing the question
#   paraphrase       the same question reworded, with the same answer and labels.
#                    Written as this reader: someone asking the blog's Q&A
#                    assistant who knows roughly what Bryan writes about and the
#                    names a post title or link would give them (Jev, Mealie,
#                    Tailwind, SvelteKit, Qwen, the Dolomites), but hasn't read the
#                    post closely, so they describe its content in everyday words,
#                    not the post's own terms. Casual; "Bryan" or "he". Keeps names
#                    and the specific things asked about (a number, a quoted label).
#                    Written by a subagent that saw only this persona and the
#                    questions: no answers, no retrieval results. Frozen once
#                    reviewed: edited only to fix meaning, never after seeing
#                    retrieval results.
#
# as_of: answers reflect the blog as of 2026-11-05 (cs21 added 2026-11-14).

as_of: "2026-11-14"

