    probe: recency
    question: Why is TPOT about 9 ms for Qwen2.5-0.5B?
    paraphrase: "Why does the smallest Qwen model take about 9 ms for each token it generates?"
    source_posts:
    - straight-line-predicts-how-fast-my-laptop-generates-llm-tokens
    superseded_posts:
    - one-reason-input-tokens-are-cheaper-than-output-tokens
    evidence:
      straight-line-predicts-how-fast-my-laptop-generates-llm-tokens: my laptop takes roughly 6.05 ms to
        read the weights plus a fixed cost of 4.03 ms
    reference_answer: 'Generating each token is limited by memory bandwidth: the model''s weights (about
      988 MB) are re-read from RAM for every output token. His linear fit attributes about 6.05 ms to reading
      the weights (at an effective 163 GB/s) plus a fixed cost of about 4.03 ms, predicting 10.08 ms against
      the 8.99 ms he measured. His earlier token-pricing post left this as an open question.'
    key_facts:
    - limited by memory bandwidth
    - weights re-read for every output token
    - about 6.05 ms reading weights plus about 4.03 ms fixed cost
    notes: New in v2. The older post measured TPOT at roughly 9-10 ms but couldn't explain it, so it can't
      answer this; it's marked superseded rather than wrong. Complements sf32, which asks what the open
      question was.

