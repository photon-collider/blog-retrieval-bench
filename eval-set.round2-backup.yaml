  - id: sf13
    type: single_fact
    topic: homelab
    question: What should you watch out for when buying a used Ryzen PRO CPU?
    paraphrase: What's the catch with second-hand business-line AMD processors pulled from office PCs?
    source_posts: [building-a-better-nas-for-my-homelab]
    reference_answer: >-
      Some are vendor-locked to a PC maker's motherboards via Platform Secure Boot
      (PSB), which blows a fuse in the CPU; Lenovo-pulled chips are an example. He
      bought one reportedly pulled from an HP system, and it worked on his ASRock board.
    key_facts:
      - vendor locking via Platform Secure Boot (PSB)
      - Lenovo chips are an example of locked CPUs
      - his chip came from an HP system and worked

