  - id: op01
    type: opinion
    topic: ai-llm
    question: What does Bryan see as Jev's limitations?
    paraphrase: What reservations did he have about that classifier model after trying it?
    source_posts: [jev-by-example]
    reference_answer: >-
      It's a black box: it returns probabilities but can't explain them (e.g., why
      heavy cream got 35% for carbonara). The burden stays on developers to define
      criteria, evaluate it on representative cases, and decide how much authority
      to give it. It's also not generative, so it can't do tasks like summarization.
    key_facts:
      - black box / can't explain its probabilities
      - developers must define criteria and evaluate it
      - not suited to generative tasks

