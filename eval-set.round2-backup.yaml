  - id: sf25
    type: single_fact
    topic: self-hosting
    question: Why does a home VPN need dynamic DNS?
    paraphrase: Why might his connection back to his home network work one day and fail the next?
    source_posts: [home-vpn-dynamic-dns]
    reference_answer: >-
      The router's WAN IP address is assigned by the ISP and can change after
      power outages, modem reboots, or ISP maintenance. Dynamic DNS keeps a
      domain name pointed at the current IP so the VPN client can always find it.
    key_facts:
      - WAN IP is dynamically assigned by the ISP and can change
      - DDNS keeps a domain pointed at the current IP

  - id: sf26
    type: single_fact
    topic: computing
    question: How does two's complement represent negative numbers?
    paraphrase: How did he explain storing negative integers in binary?
    source_posts: [insights-from-nand2tetris-part1]
    reference_answer: >-
      Take the positive number's binary representation, flip all the bits, and add
      1. Subtraction then becomes a case of addition, and the most significant bit
      acts as the sign bit.
    key_facts:
      - flip the bits and add 1
      - subtraction handled as addition
      - most significant bit is the sign bit

  - id: sf27
    type: single_fact
    topic: computing
    question: How do computers interface with keyboards and screens, according to Bryan's Nand2Tetris notes?
    paraphrase: How does a computer talk to its input and output devices?
    source_posts: [insights-from-nand2tetris-part1]
    reference_answer: >-
      Through memory maps. Devices are mapped onto chunks of memory, and the
      computer reads and writes those regions, e.g., writing pixel states to the
      screen's memory map or reading the keyboard's register.
    key_facts:
      - memory-mapped I/O
      - screen pixels and keyboard input live in mapped memory

