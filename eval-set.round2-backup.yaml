# Blog Q&A eval set — STARTER DRAFT
#
# Drafted from 21 of ~45 posts on bryananthonio.com (sampled Nov 5, 2026).
# Round 2 (same 21 posts) added questions on under-covered posts and a topic
# field for stratified sampling.
# Treat every reference_answer as a draft: verify it against the post,
# fix anything wrong, and add your own questions (aim for 50-60 total).
#
# Fields
#   id               stable identifier, never reuse
#   type             single_fact | multi_post | current_state | opinion | unanswerable
#   topic            ai-llm | backend | web-design | homelab | self-hosting |
#                    computing | personal | cross-topic  (stratification key)
#   question         phrased close to the post's own wording
#   paraphrase       same question with as little word overlap as possible
#                    (run both to measure how BM25 vs. vector search handle
#                    vocabulary mismatch)
#   source_posts     slugs that contain the answer (retrieval ground truth)
#   superseded_posts older posts with outdated info (current_state only)
#   related_posts    near-miss posts likely to tempt a wrong answer
#   reference_answer short ideal answer
#   key_facts        atomic facts a correct answer must include (for grading)
#   notes            caveats, things to verify
#
# as_of: answers reflect the blog as of 2026-11-05.

