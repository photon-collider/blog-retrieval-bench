  - id: sf06
    type: single_fact
    topic: backend
    question: Why did custom metadata disappear from Celery task documents in MongoDB, and how did Bryan fix it?
    paraphrase: Why was the extra information he attached to background jobs getting wiped from the database?
    source_posts: [custom-celery-mongodb-backend]
    reference_answer: >-
      Celery's MongoDB backend overwrites the task document with replace_one when
      storing results. He subclassed MongoBackend and overrode _store_result to use
      update_one with $set, created the initial document in a before_task_publish
      signal handler, and enabled task_track_started.
    key_facts:
      - default backend replaces the document (replace_one)
      - custom MongoBackend subclass overriding _store_result with update_one/$set
      - before_task_publish signal creates the initial document
      - task_track_started enabled

