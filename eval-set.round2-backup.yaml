  - id: sf01
    type: single_fact
    topic: ai-llm
    question: In Bryan's experiment, how much more time did an output token take than an input token?
    paraphrase: When he timed a tiny model on his laptop, how big was the gap between reading a prompt and writing a reply?
    source_posts: [one-reason-input-tokens-are-cheaper-than-output-tokens]
    reference_answer: >-
      Up to about 29x longer per output token than per input token, measured with
      a 2,048-token prompt on Qwen2.5-0.5B-Instruct running on his M2 MacBook Pro.
    key_facts:
      - up to ~29x more time per output token
      - measured at a 2,048-token prompt
      - Qwen2.5-0.5B-Instruct on an M2 MacBook Pro

  - id: sf02
    type: single_fact
    topic: ai-llm
    question: What do TTFT and TPOT measure?
    paraphrase: Which two latency numbers did he use to describe how quickly a reply starts and how quickly it streams?
    source_posts: [one-reason-input-tokens-are-cheaper-than-output-tokens]
    reference_answer: >-
      TTFT (time to first token) is how long before the response starts streaming,
      which is dominated by the prefill phase. TPOT (time per output token) is how
      fast each subsequent token is generated during the decode phase.
    key_facts:
      - TTFT = time to first token, tied to prefill
      - TPOT = time per output token, tied to decode
    notes: Acronym-heavy question; expect BM25 to do well on the original phrasing and worse on the paraphrase.

